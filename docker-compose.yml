services:
  helpdesk:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_URL: http://localhost:3001/api
        NUXT_PUBLIC_SOCKET_URL: http://localhost:3001
        NUXT_API_URL: http://host.docker.internal:3001/api
    container_name: coffee-cherry-helpdesk
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3002
      NUXT_PUBLIC_API_URL: http://localhost:3001/api
      NUXT_PUBLIC_SOCKET_URL: http://localhost:3001
      NUXT_API_URL: http://host.docker.internal:3001/api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
